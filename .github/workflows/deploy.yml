name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a live one halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Static guard
        run: bun run check:static
      - name: Tests
        run: bun run test:run
      - name: Type check
        run: bun run check
      - name: Build
        # PUBLIC_PITHOS_SHA-style CDN pinning does not apply here: assets are
        # vendored, and shellhacks.net is the custom domain, so base stays "/".
        run: bun run build
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://shellhacks.net' }}
          # "/" once shellhacks.net resolves to Pages; the repo path before
          # that, so the pre-DNS deployment is styled and navigable.
          PUBLIC_BASE_PATH: ${{ vars.PUBLIC_BASE_PATH || '/' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4